<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="100%">
  <defs>
    <linearGradient id="stTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#199e9e" />
      <stop offset="100%" stop-color="#0e7c80" />
    </linearGradient>
    <linearGradient id="stGray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#768089" />
      <stop offset="100%" stop-color="#474f56" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0e8388" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- LOGO ICON (Gear with supportive hands) -->
  <g transform="translate(10, 10)" filter="url(#softGlow)">
    <g transform="translate(70, 70)">
      <!-- Cogwheel outer gear -->
      <!-- Top Gear Half (Teal) -->
      <path d="M -60,0 A 60,60 0 0,1 60,0 L 45,0 A 45,45 0 0,0 -45,0 Z" fill="url(#stTeal)" />
      <!-- Teeth Top -->
      <rect x="-10" y="-70" width="20" height="15" rx="3" fill="url(#stTeal)" />
      <rect x="-10" y="-70" width="20" height="15" rx="3" fill="url(#stTeal)" transform="rotate(30)" />
      <rect x="-10" y="-70" width="20" height="15" rx="3" fill="url(#stTeal)" transform="rotate(60)" />
      <rect x="-10" y="-70" width="20" height="15" rx="3" fill="url(#stTeal)" transform="rotate(-30)" />
      <rect x="-10" y="-70" width="20" height="15" rx="3" fill="url(#stTeal)" transform="rotate(-60)" />
      <rect x="-10" y="-70" width="20" height="15" rx="3" fill="url(#stTeal)" transform="rotate(90)" />
      <rect x="-10" y="-70" width="20" height="15" rx="3" fill="url(#stTeal)" transform="rotate(-90)" />

      <!-- Bottom Gear Half (Slate Gray) -->
      <path d="M -60,0 A 60,60 0 0,0 60,0 L 45,0 A 45,45 0 0,1 -45,0 Z" fill="url(#stGray)" />
      <!-- Teeth Bottom -->
      <rect x="-10" y="55" width="20" height="15" rx="3" fill="url(#stGray)" />
      <rect x="-10" y="55" width="20" height="15" rx="3" fill="url(#stGray)" transform="rotate(30)" />
      <rect x="-10" y="55" width="20" height="15" rx="3" fill="url(#stGray)" transform="rotate(60)" />
      <rect x="-10" y="55" width="20" height="15" rx="3" fill="url(#stGray)" transform="rotate(-30)" />
      <rect x="-10" y="55" width="20" height="15" rx="3" fill="url(#stGray)" transform="rotate(-60)" />

      <!-- Inner white disk -->
      <circle cx="0" cy="0" r="44" fill="#ffffff" />

      <!-- Hands in center -->
      <!-- Upper Teal Hand (Reaching Down) -->
      <path d="M -28,-6 C -18,-24 8,-32 28,-18 C 34,-14 36,-8 34,-3 C 30,3 20,0 12,-2 C 2,-4 -8,0 -15,5 C -22,10 -26,7 -28,-6 Z" fill="url(#stTeal)" />
      <path d="M -12,-12 C 4,-20 20,-12 28,-4 C 23,-2 17,-5 10,-4 C 2,-3 -4,1 -10,6 C -15,3 -17,-5 -12,-12 Z" fill="#0c6b6f" />

      <!-- Lower Gray Hand (Reaching Up) -->
      <path d="M 28,6 C 18,24 -8,32 -28,18 C -34,14 -36,8 -34,3 C -30,-3 -20,0 -12,2 C -2,4 8,0 15,-5 C 22,-10 26,-7 28,6 Z" fill="url(#stGray)" />
      <path d="M 12,12 C -4,20 -20,12 -28,4 C -23,2 -17,5 -10,4 C -2,3 4,-1 10,-6 C 15,-3 17,5 12,12 Z" fill="#394046" />
    </g>
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g transform="translate(165, 45)">
    <!-- "SuperTech" -->
    <text x="0" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#0e8388">Super</tspan><tspan fill="#475569">Tech</tspan>
    </text>

    <!-- "Calibration Services" -->
    <text x="2" y="72" font-family="'Outfit', Georgia, serif" font-style="italic" font-size="22" font-weight="500" fill="#525f6c" letter-spacing="0.8">
      Calibration Services
    </text>

    <!-- Sub-badge line -->
    <rect x="2" y="86" width="340" height="1" fill="#cbd5e1" />
    <text x="2" y="101" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#0e8388" letter-spacing="2.2">
      PRECISION • ACCURACY • ISO/IEC 17025 COMPLIANT
    </text>
  </g>
</svg>
